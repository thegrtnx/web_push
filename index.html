<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<title>Web Push Notification Test</title>
	</head>
	<body>
		<h1>Web Push Notification Test</h1>
		<button id="subscribe-btn">Subscribe to Notifications</button>
		<p id="status"></p>

		<script>
			const publicVapidKey = "BPcI9q1VD5FZniOJgqzYz2Bbz6NdvND5X1nLoQTLjGc4vcTBmvMJ70bZcjbWMjtIfNr8ROcX9GERZFa7_27LQaY"; // Replace with your actual VAPID key

			document.getElementById("subscribe-btn").addEventListener("click", async () => {
				if (!("serviceWorker" in navigator)) {
					alert("Service Workers are not supported in your browser.");
					return;
				}

				try {
					// Register the service worker
					await navigator.serviceWorker.register("/service-worker.js");
					console.log("Service Worker Registered");

					// Wait until the service worker is active
					const registration = await navigator.serviceWorker.ready;

					// Subscribe to push notifications
					const subscription = await registration.pushManager.subscribe({
						userVisibleOnly: true,
						applicationServerKey: urlBase64ToUint8Array(publicVapidKey),
					});

					console.log("Subscribed:", subscription);

					// Send subscription to the backend server
					const response = await fetch("https://api.nxesair.com/v1/user/webpush/subscribe", {
						method: "POST",
						body: JSON.stringify(subscription),
						headers: {
							"Content-Type": "application/json",
						},
					});

					if (!response.ok) {
						document.getElementById("status").innerText = "Subscription failed.";
						return;
					}

					const json = await response.json();

					// Display the JSON response nicely formatted
					document.getElementById("status").innerHTML = `
						<b>Subscription Successful!</b><br />
						<pre>${JSON.stringify(json, null, 2)}</pre>
					`;
				} catch (error) {
					console.error("Subscription error:", error);
					document.getElementById("status").innerText = "Subscription error: " + error.message;
				}
			});

			// Convert VAPID key to Uint8Array
			function urlBase64ToUint8Array(base64String) {
				const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
				const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
				const rawData = window.atob(base64);
				const outputArray = new Uint8Array(rawData.length);
				for (let i = 0; i < rawData.length; ++i) {
					outputArray[i] = rawData.charCodeAt(i);
				}
				return outputArray;
			}
		</script>
	</body>
</html>
